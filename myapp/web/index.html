<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="tribeX — Find your crew, join the plan. Discover local sports, treks, jams, and fun activities nearby.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="tribeX">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="shortcut icon" href="favicon.ico"/>

  <title>tribeX — Find Local Fun</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #080C14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    @media (prefers-color-scheme: light) {
      body {
        background-color: #F8FAFC;
      }
    }
    #app-preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      background-color: #080C14;
      transition: opacity 0.3s ease-out;
    }
    @media (prefers-color-scheme: light) {
      #app-preloader {
        background-color: #F8FAFC;
      }
    }
    .preloader-brand {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #F8FAFC;
      margin-bottom: 20px;
    }
    @media (prefers-color-scheme: light) {
      .preloader-brand {
        color: #0F172A;
      }
    }
    .preloader-brand span {
      color: #6366F1;
    }
    .preloader-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366F1;
      border-radius: 50%;
      animation: preloader-spin 0.8s linear infinite;
    }
    @keyframes preloader-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app-preloader">
    <div class="preloader-brand"><span>tribe</span>X</div>
    <div class="preloader-spinner"></div>
  </div>
  <script>
    (function() {
      function removePreloader() {
        var loader = document.getElementById('app-preloader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(function() {
            if (loader && loader.parentNode) {
              loader.parentNode.removeChild(loader);
            }
          }, 300);
        }
      }
      window.addEventListener('flutter-first-frame', removePreloader);
      var interval = setInterval(function() {
        if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
          removePreloader();
          clearInterval(interval);
        }
      }, 100);
      setTimeout(function() {
        clearInterval(interval);
        removePreloader();
      }, 8000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
